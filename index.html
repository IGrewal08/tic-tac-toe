<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link href="styles.css" rel="stylesheet">
    <script defer src="javascript.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>TIC TAC TOE</h1>
            <div id="scores">
                <div class="player" id="X" >Player X <br><span id="score1">0</span></div>
                <div class="player" id="O">Player O <br><span id="score2">0</span></div>
            </div>
        </div>
        <div class="content">
            <button row="0" column="0"></button>
            <button row="0" column="1"></button>
            <button row="0" column="2"></button>
            <button row="1" column="0"></button>
            <button row="1" column="1">X</button>
            <button row="1" column="2"></button>
            <button row="2" column="0"></button>
            <button row="2" column="1"></button>
            <button row="2" column="2"></button>
        </div>
        <div class="footer">2025</div>
    </div>
</body>
</html>
