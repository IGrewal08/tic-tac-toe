<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link href="styles.css" rel="stylesheet">
    <script defer src="javascript.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 style="font-size: 60px;">TIC TAC TOE</h1>
            <div id="players">
                <div class="player" id="X">
                    <div id="name">Player<span> X</span></div>
                    <div id="score">0</div>
                </div>
                <div class="player" id="O">
                    <div id="name">Player<span> O</span></div>
                    <div id="score">0</div>
                </div>

            </div>
        </div>
        <div class="modal" id="modal">
            <div class="modal-inner">
                <h2 id="end-game-message">Player... won the game</h2>
                <div class="play-again-buttons">
                    <button id="replay">Replay</button>
                    <button id="reset">Reset</button>
                </div>
            </div>
        </div>
        <div class="content">
            <button class="board" row="0" column="0"></button>
            <button class="board" row="0" column="1"></button>
            <button class="board" row="0" column="2"></button>
            <button class="board" row="1" column="0"></button>
            <button class="board" row="1" column="1"></button>
            <button class="board" row="1" column="2"></button>
            <button class="board" row="2" column="0"></button>
            <button class="board" row="2" column="1"></button>
            <button class="board" row="2" column="2"></button>
        </div>
    </div>
</body>
</html>
